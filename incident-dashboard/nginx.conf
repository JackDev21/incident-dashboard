server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Configuración para Single Page Applications (SPA) como React
    # Si el usuario recarga una página como /incidents, Nginx no encontrará un archivo incidents.html
    # Esta regla le dice a Nginx: "Si no encuentras el archivo, devuelve index.html"
    # Así React Router puede tomar el control y mostrar la vista correcta.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Opcional: Configuración de caché para archivos estáticos (JS, CSS, imágenes)
    # Mejora el rendimiento en el navegador del cliente
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
