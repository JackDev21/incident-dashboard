version: "3.8"

services:
  # 1. Backend API
  api:
    build:
      context: ./incident-api
      dockerfile: Dockerfile
    container_name: incident_api
    env_file:
      - ./incident-api/.env
    ports:
      - "3000:3000"
    environment:
      # En Docker el CORS apunta al puerto del dashboard
      - CORS_ORIGIN=http://localhost:8080
    restart: unless-stopped

  # 2. Frontend Dashboard
  dashboard:
    build:
      context: ./incident-dashboard
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: incident_dashboard
    ports:
      - "8080:80" # Mapeamos el puerto 80 de Nginx al puerto 8080 de tu máquina
    depends_on:
      - api
    restart: unless-stopped
