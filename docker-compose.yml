version: "3.8"

services:
  # 1. Base de datos MongoDB
  mongodb:
    image: mongo:7.0
    container_name: incident_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db # Volumen para que los datos persistan si se apaga el contenedor
    restart: unless-stopped

  # 2. Backend API
  api:
    build:
      context: ./incident-api
      dockerfile: Dockerfile
    container_name: incident_api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Permitimos CORS desde el puerto donde expondremos el dashboard (80)
      - CORS_ORIGIN=http://localhost:80
      # Conexión a la BD usando el nombre del servicio de Docker ('mongodb')
      - MONGODB_URI=mongodb://mongodb:27017/incident_db
    depends_on:
      - mongodb
    restart: unless-stopped

  # 3. Frontend Dashboard
  dashboard:
    build:
      context: ./incident-dashboard
      dockerfile: Dockerfile
    container_name: incident_dashboard
    ports:
      - "80:80" # Mapeamos el puerto 80 de Nginx al puerto 80 de tu máquina
    depends_on:
      - api
    restart: unless-stopped

# Declaración del volumen para persistencia de datos
volumes:
  mongo_data:
